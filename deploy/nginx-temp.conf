# ============================================================
# Nginx — نشر على نطاق مؤقت / IP السيرفر (قبل تركيب النطاقات النهائية)
#   • واجهة الزوّار : http://<IP>            (منفذ 80)
#   • لوحة الإدارة  : http://<IP>:8081       (منفذ 8081 — تطبيق منفصل)
#   • الخادم (API) واحد على 127.0.0.1:8787 ويُمرَّر عبر /api في كلا التطبيقين
# انسخه إلى /etc/nginx/sites-available/kafalah-temp ثم فعّله:
#   ln -s /etc/nginx/sites-available/kafalah-temp /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# (احذف الرابط الرمزي الافتراضي default إن لزم: rm /etc/nginx/sites-enabled/default)
# ============================================================

# --- واجهة الزوّار (تطبيق apps/web) ---
server {
    listen 80 default_server;
    server_name _;

    root /var/www/kafalah/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- لوحة الإدارة (تطبيق apps/admin) — منفذ منفصل ---
server {
    listen 8081;
    server_name _;

    # لا تسمح بفهرسة لوحة الإدارة
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/kafalah/apps/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
