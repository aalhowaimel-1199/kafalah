# Nginx — واجهة الزوّار (apps/web) على النطاق النهائي visits.ramh.sa
# يخدم بناء الزوّار ويمرّر /api إلى الخادم. لا يحتوي أي كود إدارة.
# انسخه إلى /etc/nginx/sites-available/visits.ramh.sa ثم فعّله، ثم:
#   certbot --nginx -d visits.ramh.sa

server {
    listen 80;
    server_name visits.ramh.sa;

    root /var/www/kafalah/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
