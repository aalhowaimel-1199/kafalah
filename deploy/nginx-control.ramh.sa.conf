# Nginx — لوحة الإدارة (apps/admin) على النطاق الخاص control.ramh.sa
# تطبيق منفصل تماماً ببناء مستقل (apps/admin/dist) ويمرّر /api لنفس الخادم.
# انسخه إلى /etc/nginx/sites-available/control.ramh.sa ثم فعّله، ثم:
#   certbot --nginx -d control.ramh.sa
#
# ملاحظة أمان: لوحة الإدارة على نطاق منفصل غير معلن، مع منع الفهرسة.
# يمكن إضافة حماية إضافية (Basic Auth أو حصر IP) بإزالة التعليق في كتلة allow/deny.

server {
    listen 80;
    server_name control.ramh.sa;

    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/kafalah/apps/admin/dist;
    index index.html;

    # حصر الوصول على عناوين IP محددة (اختياري) — أزل التعليق واضبط العناوين:
    # allow 1.2.3.4;
    # deny all;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
