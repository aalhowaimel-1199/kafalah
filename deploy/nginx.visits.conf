# مثال Nginx: الواجهة الثابتة + تمرير الـ API
# visits.ramh.sa  → الواجهة
# /api و /api/auth → الخادم (Hono) على 8787

server {
    listen 80;
    server_name visits.ramh.sa;

    # ملفات الواجهة المبنية (apps/web/dist)
    root /var/www/ramh-visits;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # تمرير الـ API لنفس النطاق (يبسّط الكوكيز/CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
